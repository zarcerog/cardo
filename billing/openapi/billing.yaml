openapi: 3.0.3
info:
  title: Billing API
  version: 0.1.0
  description: Entitlement and commercial access checks.
  license:
    name: MIT
    url: https://opensource.org/license/mit
servers:
  - url: /api/v1
tags:
  - name: Billing
    description: Billing service status.
  - name: Checkout Sessions
    description: Hosted checkout session creation.
  - name: Portal Sessions
    description: Hosted billing management session creation.
  - name: Entitlements
    description: Entitlement reads and access checks.
  - name: Stripe Webhooks
    description: Stripe event ingestion.
paths:
  /billing:
    get:
      tags: [Billing]
      operationId: getBillingStatus
      summary: Get billing service status.
      security: []
      responses:
        "200":
          description: Billing service is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStatusResponse"
  /billing/checkout/sessions:
    post:
      tags: [Checkout Sessions]
      operationId: createCheckoutSession
      summary: Create a hosted checkout session for the current user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutSessionRequest"
      responses:
        "201":
          description: Checkout session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/BadGateway"
  /billing/portal/sessions:
    post:
      tags: [Portal Sessions]
      operationId: createPortalSession
      summary: Create a hosted billing portal session for the current user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePortalSessionRequest"
      responses:
        "201":
          description: Portal session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/BadGateway"
  /billing/entitlements/{product}:
    get:
      tags: [Entitlements]
      operationId: getCurrentEntitlement
      summary: Get the current user's entitlement for a product.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Product"
      responses:
        "200":
          description: Entitlement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /billing/subjects/{subjectId}/entitlements/{product}:
    get:
      tags: [Entitlements]
      operationId: getSubjectEntitlement
      summary: Get a subject's entitlement for a product.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SubjectId"
        - $ref: "#/components/parameters/Product"
      responses:
        "200":
          description: Entitlement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /billing/subjects/{subjectId}/entitlements/{product}/access:
    post:
      tags: [Entitlements]
      operationId: requireSubjectEntitlement
      summary: Require an active subject entitlement for a product.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SubjectId"
        - $ref: "#/components/parameters/Product"
      responses:
        "200":
          description: >-
            Active or past-due entitlement, or trialing entitlement whose trial has not ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /billing/subjects/{subjectId}/entitlements/{product}/trial:
    put:
      tags: [Entitlements]
      operationId: startSubjectTrial
      summary: Start a subject's trial of a product, once.
      description: >-
        Idempotent per subject and product. Creates a trialing entitlement when the subject has
        none; returns a trialing, active or past-due entitlement unchanged; refuses with
        `trial_already_used` when the subject's entitlement for the product has ended.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SubjectId"
        - $ref: "#/components/parameters/Product"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartTrialRequest"
      responses:
        "200":
          description: >-
            The subject already has a trialing, active or past-due entitlement; it is unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementResponse"
        "201":
          description: Trial started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /billing/subjects/{subjectId}/entitlements/{product}/subscription:
    put:
      tags: [Entitlements]
      operationId: setSubjectSubscription
      summary: Set a subject's entitlement to the subscription it paid for.
      description: >-
        Replaces the subject's entitlement for the product, a trialing one included, with the
        status, limits and period end of a subscription the product's own payment provider
        confirmed. Idempotent: the same body again leaves the entitlement unchanged. A
        `past_due` subscription still grants access; a `canceled` one does not.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SubjectId"
        - $ref: "#/components/parameters/Product"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSubscriptionRequest"
      responses:
        "200":
          description: The subject's entitlement now reflects the subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementResponse"
        "201":
          description: The subject had no entitlement for the product; one was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /billing/webhooks/stripe:
    post:
      tags: [Stripe Webhooks]
      operationId: createStripeWebhookEvent
      summary: Receive a Stripe webhook event.
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RawJsonPayload"
      responses:
        "204":
          description: Event accepted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SubjectId:
      name: subjectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Product:
      name: product
      in: path
      required: true
      schema:
        type: string
        example: clinic
  responses:
    BadRequest:
      $ref: "../../common/openapi/errors.yaml#/components/responses/BadRequest"
    Unauthorized:
      $ref: "../../common/openapi/errors.yaml#/components/responses/Unauthorized"
    Forbidden:
      $ref: "../../common/openapi/errors.yaml#/components/responses/Forbidden"
    NotFound:
      $ref: "../../common/openapi/errors.yaml#/components/responses/NotFound"
    Conflict:
      $ref: "../../common/openapi/errors.yaml#/components/responses/Conflict"
    BadGateway:
      $ref: "../../common/openapi/errors.yaml#/components/responses/BadGateway"
  schemas:
    ServiceStatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    RawJsonPayload:
      type: string
      description: Raw JSON payload. The exact body is required for provider webhook signature verification.
    CreateCheckoutSessionRequest:
      type: object
      required: [product, successUrl, cancelUrl]
      properties:
        product:
          type: string
          example: clinic
          x-field-extra-annotation: "@jakarta.validation.constraints.NotBlank"
        successUrl:
          type: string
          format: uri
          example: https://app.example.com/billing/success
        cancelUrl:
          type: string
          format: uri
          example: https://app.example.com/billing/cancel
    CheckoutSessionResponse:
      type: object
      required: [id, url]
      properties:
        id:
          type: string
          example: cs_test_123
        url:
          type: string
          format: uri
    CreatePortalSessionRequest:
      type: object
      required: [returnUrl]
      properties:
        returnUrl:
          type: string
          format: uri
          example: https://app.example.com/billing
    PortalSessionResponse:
      type: object
      required: [id, url]
      properties:
        id:
          type: string
          example: bps_123
        url:
          type: string
          format: uri
    StartTrialRequest:
      type: object
      required: [trialDays, tenantLimit, seatLimit]
      properties:
        trialDays:
          type: integer
          format: int32
          minimum: 1
          maximum: 365
          example: 30
        tenantLimit:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          example: 1
        seatLimit:
          type: integer
          format: int32
          minimum: 1
          maximum: 10000
          example: 5
    SetSubscriptionRequest:
      type: object
      required: [status, tenantLimit, seatLimit]
      properties:
        status:
          type: string
          enum: [active, past_due, canceled]
          description: >-
            `active` while paid for, `past_due` after a failed payment (still grants access),
            `canceled` once cancelled.
        tenantLimit:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          example: 1
        seatLimit:
          type: integer
          format: int32
          minimum: 1
          maximum: 10000
          example: 3
        currentPeriodEndsAt:
          type: string
          format: date-time
          nullable: true
          description: When the next payment is taken, or when a cancelled subscription stops.
    EntitlementResponse:
      type: object
      required: [id, subjectId, product, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
        product:
          type: string
          example: clinic
        status:
          type: string
          enum: [active, trialing, past_due, canceled]
        tenantLimit:
          type: integer
          format: int32
          nullable: true
          example: 1
        seatLimit:
          type: integer
          format: int32
          nullable: true
          example: 5
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
        currentPeriodEndsAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
